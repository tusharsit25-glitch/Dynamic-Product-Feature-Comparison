<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Product Feature Comparison</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom CSS for small styling that Tailwind can't easily do -->
  <link rel="stylesheet" href="design.css" />
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- ============ HEADER ============ -->
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-4 py-6 flex items-center gap-4">
      <!-- Simple inline SVG icon (no external icon library used) -->
      <div class="w-12 h-12 shrink-0 rounded-xl bg-indigo-600 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <!-- laptop + compare arrows icon -->
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 5h16v10H4z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M2 19h20" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 9l-2 2 2 2M15 9l2 2-2 2" />
        </svg>
      </div>
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900">Dynamic Product Comparison</h1>
        <p class="text-sm sm:text-base text-slate-500 mt-1">
          Compare laptop features side by side and find the differences instantly.
        </p>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">

    <!-- ============ PRODUCT SELECTION ============ -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6">
      <h2 class="text-lg font-semibold text-slate-900 mb-4">Select Products to Compare</h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Product 1 dropdown -->
        <div>
          <label for="product1Select" class="block text-sm font-medium text-slate-600 mb-1">
            Select Product 1
          </label>
          <select id="product1Select"
            class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm
                   focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <!-- Options are filled by JavaScript -->
          </select>
        </div>

        <!-- Product 2 dropdown -->
        <div>
          <label for="product2Select" class="block text-sm font-medium text-slate-600 mb-1">
            Select Product 2
          </label>
          <select id="product2Select"
            class="w-full rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-sm
                   focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <!-- Options are filled by JavaScript -->
          </select>
        </div>
      </div>

      <!-- Comparison status + reset button -->
      <div class="mt-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <p id="comparisonStatus" class="text-sm font-medium text-indigo-700 bg-indigo-50 inline-block px-3 py-1.5 rounded-lg">
          <!-- Filled dynamically by JS -->
        </p>

        <button id="resetBtn"
          class="inline-flex items-center justify-center gap-2 rounded-lg bg-indigo-600 hover:bg-indigo-700
                 text-white text-sm font-medium px-4 py-2 transition-colors self-start sm:self-auto">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.836 4a8 8 0 11-2.343-6.657L20 8" />
          </svg>
          Reset Comparison
        </button>
      </div>
    </section>

    <!-- ============ COMPARISON TABLE ============ -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-slate-900">Feature Comparison</h2>
        <div class="hidden sm:flex items-center gap-4 text-xs text-slate-500">
          <span class="flex items-center gap-1.5">
            <span class="w-3 h-3 rounded-sm bg-amber-100 border border-amber-300 inline-block"></span>
            Different
          </span>
          <span class="flex items-center gap-1.5">
            <span class="w-3 h-3 rounded-sm bg-slate-100 border border-slate-300 inline-block"></span>
            Same
          </span>
        </div>
      </div>

      <!-- Table wrapped in a scroll container so it stays responsive on small screens -->
      <div class="overflow-x-auto">
        <table class="w-full text-sm border-collapse">
          <thead>
            <tr class="text-left border-b border-slate-200">
              <th class="py-2.5 pr-4 font-semibold text-slate-600 w-1/4">Feature</th>
              <th id="tableHeadProduct1" class="py-2.5 px-4 font-semibold text-slate-900 w-[37.5%]"></th>
              <th id="tableHeadProduct2" class="py-2.5 px-4 font-semibold text-slate-900 w-[37.5%]"></th>
            </tr>
          </thead>
          <!-- Table rows are generated dynamically by JavaScript -->
          <tbody id="comparisonTableBody"></tbody>
        </table>
      </div>
    </section>

    <!-- ============ PRODUCT SUMMARY CARDS ============ -->
    <section>
      <h2 class="text-lg font-semibold text-slate-900 mb-4">Product Summary</h2>
      <div id="productCardsContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Two summary cards are injected here by JavaScript -->
      </div>
    </section>

  </main>

  <footer class="max-w-5xl mx-auto px-4 py-6 text-center text-xs text-slate-400">
    College Practical Project &mdash; Dynamic Product Feature Comparison (Sample data for demo purposes only)
  </footer>

  <!-- All JavaScript logic -->
  <script src="compare.js"></script>
</body>
</html>
